services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_ordesoft
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tu_password_seguro
      POSTGRES_DB: ordesoft_db
    ports:
      - "5433:5432"  # <-- Cambiado aquí
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: